<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Monitoring Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.92);
      --panel-2: rgba(15, 23, 42, 0.88);
      --line: rgba(148, 163, 184, 0.2);
      --text: #edf2ff;
      --muted: #a6b4d3;
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --blue: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #111b2d 0%, var(--bg) 42%);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 22px;
      box-shadow: 0 20px 40px var(--shadow);
    }

    .brand {
      font-size: 1.7rem;
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      border: 1px solid var(--line);
      background: rgba(34, 197, 94, 0.12);
      color: #d1fae5;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin: 22px 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 35px var(--shadow);
    }

    .card h3 {
      margin: 0 0 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
    }

    .metric {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    textarea, button, input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 12px 14px;
      font-size: 1rem;
    }

    textarea {
      background: rgba(11, 16, 32, 0.95);
      color: var(--text);
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border: none;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .secondary {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .token-group {
      margin-top: 18px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      overflow: hidden;
    }

    .token-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 26, 43, 0.9);
    }

    .token-label {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .token-badge {
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .mini-btn {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      min-width: 78px;
      border: 1px solid var(--line);
    }

    .mini-btn.danger {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
      border-color: rgba(239,68,68,.35);
    }

    .mini-btn.export {
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      border-color: rgba(56,189,248,.35);
    }

    .token-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .status-online { background: var(--green-soft); color: #d1fae5; border: 1px solid rgba(34,197,94,.35); }
    .status-connecting { background: var(--amber-soft); color: #fef3c7; border: 1px solid rgba(251,191,36,.35); }
    .status-reconnecting { background: var(--amber-soft); color: #fef3c7; border: 1px solid rgba(251,191,36,.35); }
    .status-error { background: var(--red-soft); color: #fecaca; border: 1px solid rgba(239,68,68,.35); }
    .status-idle { background: rgba(148,163,184,.12); color: var(--muted); border: 1px solid var(--line); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 12px;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: rgba(15, 23, 42, 0.7);
    }

    .wide { min-width: 220px; }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .button-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">Monitor Control</div>
      <div class="status-pill"><span class="dot"></span> Service Active</div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Active Tokens</h3>
        <div class="metric" id="active-token-count">0</div>
        <div class="muted">Accounts currently online</div>
      </div>

      <div class="card">
        <h3>Targets</h3>
        <div class="metric" id="target-count">0</div>
        <div class="muted">Total tracked users</div>
      </div>

      <div class="card">
        <h3>Alerts</h3>
        <div class="metric" id="alert-count">0</div>
        <div class="muted">Tokens with problems</div>
      </div>

      <div class="card">
        <h3>Activity</h3>
        <div class="metric" id="activity-status">Idle</div>
        <div class="muted">Last monitor action</div>
      </div>
    </div>

    <div class="card">
      <h3>Monitor Control</h3>
      <textarea id="tokenInput" placeholder="Paste tokens here, one per line or separated by commas/semicolons"></textarea>

      <div class="button-row">
        <button id="startBtn">Start Monitoring</button>
        <button class="secondary" id="clearTokensBtn">Clear Tokens</button>
        <button class="secondary" id="downloadTargetsBtn">Download CSV</button>
      </div>

      <div class="button-row">
        <button class="secondary" id="downloadLogsBtn">Download Host Logs</button>
      </div>
    </div>

    <div class="card" style="margin-top: 22px;">
      <h3>Token Groups</h3>
      <div style="margin-bottom: 12px;">
        <input id="tokenFilter" type="text" placeholder="Filter tokens or usernames..." style="width:100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(11,16,32,.95); color: var(--text); padding: 12px 14px; font-size: 1rem;" />
      </div>
      <div id="tokenGroups"></div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const clearTokensBtn = document.getElementById('clearTokensBtn');
    const tokenFilter = document.getElementById('tokenFilter');
    const tokenInput = document.getElementById('tokenInput');
    const tokenGroups = document.getElementById('tokenGroups');
    const targetCount = document.getElementById('target-count');
    const activeTokenCount = document.getElementById('active-token-count');
    const alertCount = document.getElementById('alert-count');
    const activityStatus = document.getElementById('activity-status');
    let cachedTargetsData = {};
    let cachedStatusData = {};

    async function fetchTokenTargets() {
      try {
        const response = await fetch('/api/token-targets');
        if (!response.ok) return {};
        const data = await response.json();
        return data && typeof data === 'object' ? data : {};
      } catch (error) {
        return {};
      }
    }

    async function fetchTokenStatus() {
      try {
        const response = await fetch('/api/token-status');
        if (!response.ok) return {};
        const data = await response.json();
        return data && typeof data === 'object' ? data : {};
      } catch (error) {
        return {};
      }
    }

    function statusLabel(value) {
      const map = {
        online: 'online',
        connecting: 'connecting',
        reconnecting: 'reconnecting',
        error: 'error',
        idle: 'idle'
      };
      return map[value] || 'idle';
    }

    function renderSummary(tokensStatus, targetsData) {
      const tokens = Object.keys(tokensStatus);
      let totalTargets = 0;
      let active = 0;
      let alerts = 0;

      for (const token of tokens) {
        const list = Array.isArray(targetsData[token]) ? targetsData[token] : [];
        totalTargets += list.length;

        const state = tokensStatus[token] || {};
        if (state.status === 'online') active += 1;
        if (state.status === 'error') alerts += 1;
      }

      targetCount.textContent = String(totalTargets);
      activeTokenCount.textContent = String(active);
      alertCount.textContent = String(alerts);
    }

    function renderTokenGroups(data, statusData, filterText = '') {
      const tokens = Object.keys(data);
      const statusMap = statusData || {};
      const normalizedFilter = (filterText || '').trim().toLowerCase();

      const filteredTokens = tokens.filter((token) => {
        if (!normalizedFilter) return true;
        const rows = Array.isArray(data[token]) ? data[token] : [];
        const rowText = rows
          .map((row) => `${row.username || ''} ${row.globalName || ''} ${row.guildId || ''} ${row.userId || ''}`)
          .join(' ')
          .toLowerCase();
        return token.toLowerCase().includes(normalizedFilter) || rowText.includes(normalizedFilter);
      });

      if (!filteredTokens.length) {
        tokenGroups.innerHTML = `
          <div class="token-group">
            <div class="token-header">
              <span class="token-label">No matching token group</span>
            </div>
            <div style="padding: 12px 14px;">
              <div class="muted">No tokens matched the current filter.</div>
            </div>
          </div>
        `;
        renderSummary(statusMap, data);
        return;
      }

      tokenGroups.innerHTML = filteredTokens.map((token) => {
        const rows = Array.isArray(data[token]) ? data[token] : [];
        const state = statusMap[token] || { status: 'idle', targetCount: 0 };
        const rowsHtml = rows.length
          ? rows.map((row) => `
              <tr>
                <td>${row.timestamp || '-'}</td>
                <td>${row.userId || '-'}</td>
                <td>${row.username || '-'}</td>
                <td>${row.globalName || '-'}</td>
                <td>${row.discriminator || '-'}</td>
                <td>${row.avatar || '-'}</td>
                <td>${row.bot ? 'Yes' : 'No'}</td>
                <td>${row.guildId || '-'}</td>
                <td>${row.joinedAt || '-'}</td>
                <td class="wide">${JSON.stringify(row.rawData || {}).slice(0, 120)}${JSON.stringify(row.rawData || {}).length > 120 ? '…' : ''}</td>
              </tr>
            `).join('')
          : '<tr><td colspan="10" class="muted">No targets for this token yet.</td></tr>';

        const label = statusLabel(state.status || 'idle');

        return `
          <div class="token-group">
            <div class="token-header">
              <span class="token-label">Token: ${token.slice(0, 12)}...</span>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <span class="token-status status-${label}">${label}</span>
                <span class="token-badge">${rows.length} target(s)</span>
                <button class="mini-btn export" data-action="export" data-token="${token}">Export</button>
                <button class="mini-btn danger" data-action="remove" data-token="${token}">Remove</button>
              </div>
            </div>
            <div style="padding: 12px 14px;">
              <table>
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>User ID</th>
                    <th>Username</th>
                    <th>Global Name</th>
                    <th>Discriminator</th>
                    <th>Avatar</th>
                    <th>Bot</th>
                    <th>Guild ID</th>
                    <th>Joined At</th>
                    <th class="wide">Raw Data</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      renderSummary(statusMap, data);
    }

    function csvEscape(value) {
      const text = value === null || value === undefined ? '' : String(value);
      return `"${text.replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;
    }

    function downloadTokenCsv(token) {
      const rows = Array.isArray(cachedTargetsData[token]) ? cachedTargetsData[token] : [];
      if (!rows.length) {
        alert('There are no targets for this token yet.');
        return;
      }

      const header = ['Timestamp', 'User ID', 'Username', 'Global Name', 'Discriminator', 'Avatar', 'Bot', 'Guild ID', 'Joined At', 'Raw Data'];
      const csvRows = rows.map((row) => [
        row.timestamp || '',
        row.userId || '',
        row.username || '',
        row.globalName || '',
        row.discriminator || '',
        row.avatar || '',
        row.bot ? 'true' : 'false',
        row.guildId || '',
        row.joinedAt || '',
        JSON.stringify(row.rawData || {})
      ].map(csvEscape).join(','));

      const blob = new Blob([header.join(',') + '\n' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `token_${token.slice(0, 12)}_targets.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function loadTargets(filterValue = '') {
      const [targetsData, statusData] = await Promise.all([
        fetchTokenTargets(),
        fetchTokenStatus()
      ]);
      cachedTargetsData = targetsData;
      cachedStatusData = statusData;
      renderTokenGroups(targetsData, statusData, filterValue);
    }

    startBtn.addEventListener('click', async () => {
      const tokens = tokenInput.value
        .split(/[\r\n,;]+/)
        .map((token) => token.trim())
        .filter(Boolean);

      if (!tokens.length) {
        alert('Please enter at least one token.');
        return;
      }

      activityStatus.textContent = 'Starting';
      try {
        const response = await fetch('/api/start-monitor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokens })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Failed to start monitoring.');
        }

        activityStatus.textContent = 'Monitoring';
        alert(result.message || `Monitoring started for ${tokens.length} token(s).`);
        await loadTargets(tokenFilter.value.trim().toLowerCase());
      } catch (error) {
        activityStatus.textContent = 'Error';
        alert(error.message || 'Something went wrong.');
      }
    });

    clearTokensBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/clear-tokens', { method: 'POST' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Failed to clear tokens.');
        activityStatus.textContent = 'Cleared';
        await loadTargets(tokenFilter.value.trim().toLowerCase());
      } catch (error) {
        activityStatus.textContent = 'Error';
        alert(error.message || 'Failed to clear tokens.');
      }
    });

    tokenGroups.addEventListener('click', async (event) => {
      const target = event.target.closest('.mini-btn');
      if (!target) return;

      const token = target.getAttribute('data-token');
      const action = target.getAttribute('data-action');
      if (!token) return;

      if (action === 'export') {
        downloadTokenCsv(token);
        return;
      }

      try {
        const response = await fetch('/api/remove-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Failed to remove token.');
        activityStatus.textContent = 'Removed';
        await loadTargets(tokenFilter.value.trim().toLowerCase());
      } catch (error) {
        activityStatus.textContent = 'Error';
        alert(error.message || 'Failed to remove token.');
      }
    });

    tokenFilter.addEventListener('input', () => {
      loadTargets(tokenFilter.value.trim().toLowerCase());
    });

    document.getElementById('downloadTargetsBtn').addEventListener('click', () => {
      window.location.href = '/api/download-targets';
    });

    document.getElementById('downloadLogsBtn').addEventListener('click', () => {
      window.location.href = '/api/download-host-logs';
    });

    loadTargets();
    setInterval(() => loadTargets(tokenFilter.value.trim().toLowerCase()), 5000);
  </script>
</body>
</html>
