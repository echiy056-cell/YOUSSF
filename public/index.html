<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --line: rgba(148, 163, 184, 0.18);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --green: #22c55e;
        --green-soft: rgba(34, 197, 94, 0.15);
        --blue: #38bdf8;
        --blue-soft: rgba(56, 189, 248, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817 0%, #0f172a 45%, #111827 100%);
        color: var(--text);
      }

      .container {
        width: min(1300px, 96%);
        margin: 32px auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 22px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.22);
      }

      .brand {
        font-size: 1.4rem;
        font-weight: 700;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--green-soft);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.85rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(34,197,94,0.9);
      }

      .grid {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 18px 30px rgba(0,0,0,0.14);
      }

      .card h3 {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric {
        font-size: 2.1rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .muted {
        color: var(--muted);
        font-size: 0.9rem;
      }

      textarea, button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 12px 14px;
        font-size: 1rem;
      }

      textarea {
        background: rgba(15, 23, 42, 0.95);
        color: var(--text);
        min-height: 110px;
        resize: vertical;
      }

      button {
        background: linear-gradient(135deg, var(--blue), #2563eb);
        border: none;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      .button-row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .secondary {
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid var(--line);
        color: var(--text);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--line);
      }

      th, td {
        padding: 12px 10px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 12px;
      }

      th {
        color: var(--muted);
        background: rgba(15, 23, 42, 0.9);
      }

      .wide {
        min-width: 240px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">Monitor Control</div>
        <div class="status"><span class="dot"></span> Service Active</div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Session</h3>
          <div class="metric">Online</div>
          <div class="muted">Gateway connection status</div>
        </div>

        <div class="card">
          <h3>Targets</h3>
          <div class="metric" id="target-count">0</div>
          <div class="muted">Tracked users this session</div>
        </div>

        <div class="card">
          <h3>Activity</h3>
          <div class="metric" id="activity-status">Idle</div>
          <div class="muted">Last monitor event</div>
        </div>
      </div>

      <div class="card" style="margin-top: 24px;">
        <h3>Control Panel</h3>
        <textarea id="tokenInput" placeholder="Paste one token per line, or separate by commas/semicolons"></textarea>
        <div class="button-row">
          <button id="startBtn">Start Monitoring</button>
          <button class="secondary" id="downloadTargetsBtn">Download CSV</button>
        </div>
        <div class="button-row">
          <button class="secondary" id="downloadLogsBtn">Download Logs</button>
        </div>
      </div>

      <div class="card" style="margin-top: 24px;">
        <h3>Recent Targets</h3>
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>User ID</th>
              <th>Username</th>
              <th>Global Name</th>
              <th>Discriminator</th>
              <th>Avatar</th>
              <th>Bot</th>
              <th>Guild ID</th>
              <th>Joined At</th>
              <th class="wide">Raw Data</th>
            </tr>
          </thead>
          <tbody id="targetsBody">
            <tr>
              <td colspan="10" class="muted">No targets logged yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      const startBtn = document.getElementById('startBtn');
      const tokenInput = document.getElementById('tokenInput');
      const targetsBody = document.getElementById('targetsBody');
      const targetCount = document.getElementById('target-count');
      const activityStatus = document.getElementById('activity-status');

      async function fetchTargetRows() {
        try {
          const response = await fetch('/api/targets');
          if (!response.ok) return [];
          const rows = await response.json();
          return Array.isArray(rows) ? rows : [];
        } catch (error) {
          return [];
        }
      }

      function renderRows(rows) {
        if (!rows.length) {
          targetsBody.innerHTML = '<tr><td colspan="10" class="muted">No targets logged yet.</td></tr>';
          targetCount.textContent = '0';
          return;
        }

        targetCount.textContent = String(rows.length);
        targetsBody.innerHTML = rows.slice(-20).reverse().map(row => {
          const rawString = row.rawData ? JSON.stringify(row.rawData) : '{}';
          return `
            <tr>
              <td>${row.timestamp || '-'}</td>
              <td>${row.userId || '-'}</td>
              <td>${row.username || '-'}</td>
              <td>${row.globalName || '-'}</td>
              <td>${row.discriminator || '-'}</td>
              <td>${row.avatar || '-'}</td>
              <td>${row.bot ? 'Yes' : 'No'}</td>
              <td>${row.guildId || '-'}</td>
              <td>${row.joinedAt || '-'}</td>
              <td class="wide" title="${rawString.replace(/"/g, '&quot;')}">
                ${rawString.length > 80 ? rawString.slice(0, 80) + '…' : rawString}
              </td>
            </tr>
          `;
        }).join('');
      }

      async function loadTargets() {
        const rows = await fetchTargetRows();
        renderRows(rows);
      }

      startBtn.addEventListener('click', async () => {
        const tokens = tokenInput.value
          .split(/[\r\n,;]+/)
          .map((token) => token.trim())
          .filter(Boolean);

        if (!tokens.length) {
          alert('Please enter at least one Discord token.');
          return;
        }

        activityStatus.textContent = 'Starting';
        try {
          const response = await fetch('/api/start-monitor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tokens })
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Failed to start monitoring.');
          }

          activityStatus.textContent = 'Monitoring';
          alert(result.message || `Monitoring started for ${tokens.length} token(s).`);
        } catch (error) {
          activityStatus.textContent = 'Error';
          alert(error.message || 'Something went wrong.');
        }
      });

      document.getElementById('downloadTargetsBtn').addEventListener('click', () => {
        window.location.href = '/api/download-targets';
      });

      document.getElementById('downloadLogsBtn').addEventListener('click', () => {
        window.location.href = '/api/download-host-logs';
      });

      loadTargets();
      setInterval(loadTargets, 5000);
    </script>
  </body>
</html>
